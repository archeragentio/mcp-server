name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --no-banner --verbose --max-decode-depth 3'
      - name: Scan checked-out files
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . --redact --no-banner --verbose --max-decode-depth 3'
