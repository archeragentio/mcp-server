name: Protocol conformance

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:conformance
      - name: Start synthetic Provider API and gateway
        run: |
          pnpm dev:fixture > "$RUNNER_TEMP/archer-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/archer-fixture.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/archer-fixture.log"
          exit 1
      - name: Validate MPP challenge conformance
        run: pnpm exec mppx validate http://127.0.0.1:3100 --endpoint GET:/v1/stocks
      - run: pnpm conformance:smoke
      - name: Stop fixture
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/archer-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/archer-fixture.pid")" || true
          fi
          cat "$RUNNER_TEMP/archer-fixture.log" || true
